<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المخزن الذكي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #059669; }
        .btn-green:hover { background-color: #047857; }
        .btn-excel { background-color: #0d9488; }
        .btn-excel:hover { background-color: #0f766e; }
        .success { color: #4ade80; text-align: center; }
        .error { color: #f87171; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 10px; text-align: center; }
        th { background-color: #334155; }
    </style>
</head>
<body>

    <h2>📦 متجر المخزن الذكي</h2>

    <!-- إضافة منتج جديد -->
    <div class="card">
        <h3>➕ إضافة منتج جديد</h3>
        <input type="text" id="prod-name" placeholder="اسم المنتج">
        <input type="number" id="prod-quantity" placeholder="الكمية">
        <input type="number" step="0.01" id="prod-price" placeholder="السعر (ر.س)">
        <input type="text" id="prod-vendor" placeholder="اسم البائع (اختياري)">
        <button onclick="addProduct()">إضافة المنتج للسيرفر</button>
        <p id="add-msg"></p>
    </div>

    <!-- زر تحميل تقرير إكسل -->
    <div class="card" style="text-align: center;">
        <button class="btn-excel" onclick="window.location.href='/api/export-excel'">📥 تحميل تقرير المنتجات (ملف إكسل)</button>
    </div>

    <!-- قائمة المنتجات -->
    <div class="card">
        <h3>📦 قائمة منتجات المتجر العامة</h3>
        <button class="btn-green" onclick="loadProducts()">🔄 تحديث القائمة</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>اسم المنتج</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>البائع</th>
                    </tr>
                
                <tbody id="products-table">
                    <tr><td colspan="5">لا توجد منتجات مسجلة حالياً.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- قائمة المستخدمين -->
    <div class="card">
        <h3>👥 قائمة المستخدمين والناس</h3>
        <button onclick="loadUsers()">🔄 تحديث قائمة الناس</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>البريد الإلكتروني</th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr><td colspan="2">لا يوجد مستخدمون مسجلون حالياً.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function addProduct() {
            const name = document.getElementById('prod-name').value;
            const quantity = document.getElementById('prod-quantity').value;
            const price = document.getElementById('prod-price').value;
            const vendor = document.getElementById('prod-vendor').value;
            const msg = document.getElementById('add-msg');

            fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity, price, vendor })
            })
            .then(async res => {
                let data = await res.json();
                if (!res.ok) throw new Error(data.message || 'فشل إضافة المنتج');
                return data;
            })
            .then(data => {
                msg.innerText = data.message || 'تم إضافة المنتج بنجاح';
                msg.className = 'success';
                loadProducts();
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-quantity').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-vendor').value = '';
            })
            .catch(err => {
                msg.innerText = err.message;
                msg.className = 'error';
            });
        }

        function loadProducts() {
            fetch('/api/products')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('products-table');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">لا توجد منتجات مسجلة حالياً.</td></tr>';
                    return;
                }
                data.forEach(p => {
                    tbody.innerHTML += `<tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.quantity}</td>
                        <td>${p.price}</td>
                        <td>${p.vendor || '-'}</td>
                    </tr>`;
                });
            })
            .catch(err => console.error('خطأ في جلب المنتجات:', err));
        }

        function loadUsers() {
            fetch('/api/users')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('users-table');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2">لا يوجد مستخدمون مسجلون حالياً.</td></tr>';
                    return;
                }
                data.forEach(u => {
                    tbody.innerHTML += `<tr>
                        <td>${u.id}</td>
                        <td>${u.email}</td>
                    </tr>`;
                });
            })
            .catch(err => console.error('خطأ في جلب المستخدمين:', err));
        }

        window.onload = function() {
            loadProducts();
            loadUsers();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المخزن الذكي</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            text-align: center;
            color: #38bdf8;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .success { color: #4ade80; text-align: center; margin-top: 10px; }
        .error { color: #ef4444; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>متجر المخزن الذكي 🛒</h1>
        <p style="text-align: center; color: #94a3b8;">واجهة تفاعلية لعرض المنتجات والأسعار للعامة</p>

        <!-- لوحة تسجيل دخول المدير -->
        <div class="card" id="login-card">
            <h2>🔐 لوحة تحكم المدير (لإضافة منتجات)</h2>
            <input type="email" id="admin-email" placeholder="البريد الإلكتروني للمدير">
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button onclick="loginAdmin()">تسجيل دخول المدير</button>
            <div id="login-msg"></div>
        </div>

        <!-- لوحة إضافة المنتجات (مخفية وتظهر بعد نجاح تسجيل الدخول) -->
        <div class="card" id="admin-panel" style="display: none;">
            <h3>➕ إضافة منتج جديد</h3>
            <input type="text" id="prod-name" placeholder="اسم المنتج">
            <input type="number" id="prod-quantity" placeholder="الكمية">
            <input type="number" step="0.01" id="prod-price" placeholder="السعر (ر.س)">
            <button onclick="addProduct()">إضافة المنتج للسيرفر</button>
            <div id="add-msg"></div>
        </div>

        <!-- قائمة المنتجات العامة -->
        <div class="card">
            <h2>📦 قائمة منتجات المتجر العامة</h2>
            <button onclick="loadProducts()" style="background-color: #059669; margin-bottom: 15px;">🔄 تحديث القائمة</button>
            <input type="text" id="search-input" placeholder="ابحث عن أي منتج بالاسم..." oninput="filterProducts()">
            
            <div id="products-list">
                <p style="text-align: center; color: #94a3b8;">جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <script>
    let allProductsCache = [];

    async function loadProducts() {
        let listDiv = document.getElementById('products-list');
        if (!listDiv) return;
        listDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">جاري تحميل المنتجات...</p>';
        try {
            let res = await fetch('/api/products');
            if (!res.ok) {
                throw new Error('حالة السيرفر غير صحيحة: ' + res.status);
            }
            let products = await res.json();
            allProductsCache = products;
            displayProducts(products);
        } catch (err) {
            listDiv.innerHTML = '<p style="text-align: center; color: #ef4444;">فشل الاتصال: ' + err.message + '</p>';
        }
    }

    function displayProducts(products) {
        let listDiv = document.getElementById('products-list');
        if (!listDiv) return;
        listDiv.innerHTML = '';
        if (!products || products.length === 0) {
            listDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">لا توجد منتجات مسجلة حالياً (قاعدة البيانات فارغة).</p>';
            return;
        }
        let html = '';
        products.forEach(p => {
            html += `
                <div style="background-color: #334155; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="color: #38bdf8; font-size: 16px;">${p.name || 'بدون اسم'}</strong><br>
                        <small style="color: #94a3b8;">البائع: ${p.vendor || 'غير محدد'}</small>
                    </div>
                    <div>
                        <span>الكمية: ${p.quantity || 0}</span> | 
                        <span style="color: #38bdf8; font-weight: bold;">${p.price || 0} ر.س</span>
                    </div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function filterProducts() {
        let searchInput = document.getElementById('search-input');
        if (!searchInput) return;
        let query = searchInput.value.toLowerCase();
        let filtered = allProductsCache.filter(p => p.name && p.name.toLowerCase().includes(query));
        displayProducts(filtered);
    }

    function loginAdmin() {
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        const msg = document.getElementById('login-msg');

        fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        })
        .then(res => res.json())
        .then(data => {
            if (res && res.ok) { // handle based on response
            }
            // تحقق من النجاح بناء على شكل رد البايثون عندك
            msg.innerText = data.message || 'تم تسجيل الدخول بنجاح';
            msg.className = 'success';
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        })
        .catch(err => {
            msg.innerText = 'فشل تسجيل الدخول أو خطأ في البيانات';
            msg.className = 'error';
        });
    }

    function addProduct() {
        const name = document.getElementById('prod-name').value;
        const quantity = document.getElementById('prod-quantity').value;
        const price = document.getElementById('prod-price').value;
        const msg = document.getElementById('add-msg');

        fetch('/add-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, quantity, price })
        })
        .then(res => res.json())
        .then(data => {
            msg.innerText = data.message || 'تمت إضافة المنتج بنجاح';
            msg.className = 'success';
            loadProducts();
        })
        .catch(err => {
            msg.innerText = 'حدث خطأ أثناء الإضافة';
            msg.className = 'error';
        });
    }

    window.onload = function() {
        loadProducts();
    };
    </script>
</body>
</html>

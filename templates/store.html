<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المخزن الذكي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; text-align: center; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #059669; }
        .btn-green:hover { background-color: #047857; }
        .btn-excel { background-color: #0d9488; }
        .btn-excel:hover { background-color: #0f766e; }
        .btn-edit { background-color: #d97706; padding: 6px 12px; width: auto; margin: 2px; }
        .btn-edit:hover { background-color: #b45309; }
        .btn-delete { background-color: #dc2626; padding: 6px 12px; width: auto; margin: 2px; }
        .btn-delete:hover { background-color: #b91c1c; }
        .success { color: #4ade80; text-align: center; }
        .error { color: #f87171; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 10px; text-align: center; }
        th { background-color: #334155; }
    </style>
</head>
<body>

    <h2>📦 متجر المخزن الذكي</h2>

    <!-- إضافة / تعديل منتج -->
    <div class="card">
        <h3 id="form-title">➕ إضافة منتج جديد</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="prod-name" placeholder="اسم المنتج">
        <input type="number" id="prod-quantity" placeholder="الكمية">
        <input type="number" step="0.01" id="prod-price" placeholder="السعر (ر.س)">
        <input type="text" id="prod-vendor" placeholder="اسم البائع (اختياري)">
        <button id="submit-btn" onclick="saveProduct()">إضافة المنتج للسيرفر</button>
        <button id="cancel-btn" style="background-color: #475569; display: none;" onclick="resetForm()">إلغاء التعديل</button>
        <p id="add-msg"></p>
    </div>

    <!-- زر تحميل تقرير إكسل -->
    <div class="card" style="text-align: center;">
        <button class="btn-excel" onclick="window.location.href='/api/export-excel'">📥 تحميل تقرير المنتجات (ملف إكسل)</button>
    </div>

    <!-- قائمة المنتجات -->
    <div class="card">
        <h3>📦 قائمة منتجات المتجر العامة</h3>
        <button class="btn-green" onclick="loadProducts()">🔄 تحديث القائمة</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>اسم المنتج</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>البائع</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="6">لا توجد منتجات مسجلة حالياً.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- قائمة المستخدمين -->
    <div class="card">
        <h3>👥 قائمة المستخدمين والناس</h3>
        <button onclick="loadUsers()">🔄 تحديث قائمة الناس</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>البريد الإلكتروني</th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr><td colspan="2">لا يوجد مستخدمون مسجلون حالياً.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function saveProduct() {
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('prod-name').value;
            const quantity = document.getElementById('prod-quantity').value;
            const price = document.getElementById('prod-price').value;
            const vendor = document.getElementById('prod-vendor').value;
            const msg = document.getElementById('add-msg');

            const url = editId ? `/api/products/${editId}` : '/api/products';
            const method = editId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, quantity, price, vendor })
            })
            .then(async res => {
                let data = await res.json();
                if (!res.ok) throw new Error(data.message || 'فشل العملية');
                return data;
            })
            .then(data => {
                msg.innerText = data.message || 'تم بنجاح';
                msg.className = 'success';
                loadProducts();
                resetForm();
            })
            .catch(err => {
                msg.innerText = err.message;
                msg.className = 'error';
            });
        }

        function loadProducts() {
            fetch('/api/products')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('products-table');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">لا توجد منتجات مسجلة حالياً.</td></tr>';
                    return;
                }
                data.forEach(p => {
                    tbody.innerHTML += `<tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.quantity}</td>
                        <td>${p.price}</td>
                        <td>${p.vendor || '-'}</td>
                        <td>
                            <button class="btn-edit" onclick="editProduct(${p.id}, '${p.name}', ${p.quantity}, ${p.price}, '${p.vendor || ''}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button>
                        </td>
                    </tr>`;
                });
            })
            .catch(err => console.error('خطأ في جلب المنتجات:', err));
        }

        function editProduct(id, name, quantity, price, vendor) {
            document.getElementById('edit-id').value = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-quantity').value = quantity;
            document.getElementById('prod-price').value = price;
            document.getElementById('prod-vendor').value = vendor === 'null' ? '' : vendor;
            
            document.getElementById('form-title').innerText = '✏️ تعديل المنتج رقم ' + id;
            document.getElementById('submit-btn').innerText = 'حفظ التعديلات';
            document.getElementById('submit-btn').style.backgroundColor = '#d97706';
            document.getElementById('cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-quantity').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-vendor').value = '';
            
            document.getElementById('form-title').innerText = '➕ إضافة منتج جديد';
            document.getElementById('submit-btn').innerText = 'إضافة المنتج للسيرفر';
            document.getElementById('submit-btn').style.backgroundColor = '#2563eb';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

            fetch(`/api/products/${id}`, {
                method: 'DELETE'
            })
            .then(async res => {
                let data = await res.json();
                if (!res.ok) throw new Error(data.message || 'فشل الحذف');
                return data;
            })
            .then(data => {
                alert(data.message || 'تم الحذف بنجاح');
                loadProducts();
            })
            .catch(err => alert('خطأ: ' + err.message));
        }

        function loadUsers() {
            fetch('/api/users')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('users-table');
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2">لا يوجد مستخدمون مسجلون حالياً.</td></tr>';
                    return;
                }
                data.forEach(u => {
                    tbody.innerHTML += `<tr>
                        <td>${u.id}</td>
                        <td>${u.email}</td>
                    </tr>`;
                });
            })
            .catch(err => console.error('خطأ في جلب المستخدمين:', err));
        }

        window.onload = function() {
            loadProducts();
            loadUsers();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المخزن الذكي</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: #38bdf8;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .product-item {
            background-color: #334155;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .error { color: #f87171; text-align: center; }
        .success { color: #4ade80; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 متجر المخزن الذكي</h1>
    <p style="text-align: center; color: #94a3b8;">واجهة تفاعلية لعرض المنتجات والأسعار للعامة</p>

    <!-- لوحة تحكم المدير -->
    <div class="card">
        <h2>🔐 لوحة تحكم المدير (لإضافة منتجات)</h2>
        <div id="login-section">
            <input type="email" id="admin-email" placeholder="البريد الإلكتروني للمدير">
            <input type="password" id="admin-password" placeholder="كلمة المرور">
            <button onclick="loginAdmin()">تسجيل دخول المدير</button>
            <p id="login-msg"></p>
        </div>

        <div id="admin-panel" style="display: none;">
            <p class="success">تم تسجيل الدخول بنجاح كمدير ✅</p>
            <h3>إضافة منتج جديد</h3>
            <input type="text" id="prod-name" placeholder="اسم المنتج">
            <input type="number" id="prod-qty" placeholder="الكمية">
            <input type="number" step="0.01" id="prod-price" placeholder="السعر">
            <button onclick="addProduct()">إضافة للمتجر فوراً</button>
            <p id="add-msg"></p>
      <button onclick="exportReport()" style="background-color: #0284c7; margin-top: 10px; width: 100%; padding: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer;">📊 تحميل تقرير المخزون (Excel)</button>
        </div>
    </div>

    <!-- قائمة المنتجات العامة -->
    <div class="card">
        <h2>📦 قائمة منتجات المتجر العامة</h2>
        <button onclick="loadProducts()" style="background-color: #047857;">🔄 تحديث القائمة</button>
<input type="text" id="search-input" placeholder="🔍 ابحث عن أي منتج بالاسم..." onkeyup="filterProducts()" style="width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; background-color: #334155; border: 1px solid #475569; border-radius: 5px; color: white; font-size: 14px;">
<div id="products-list" style="margin-top: 15px;">
    <p style="text-align: center; color: #94a3b8;">جاري تحميل المنتجات...</p>
</div>
        
        </div>
    </div>
</div>
<script>
let allProductsCache = [];

async function loadProducts() {
    let listDiv = document.getElementById('products-list');
    if (!listDiv) return;
    listDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">جاري تحميل المنتجات...</p>';
    try {
        let res = await fetch('/api/products');
        if (!res.ok) {
            throw new Error('حالة السيرفر غير صحيحة: ' + res.status);
        }
        let products = await res.json();
        allProductsCache = products;
        displayProducts(products);
    } catch (err) {
        listDiv.innerHTML = '<p style="text-align: center; color: #ef4444;">فشل الاتصال: ' + err.message + '</p>';
    }
}

function displayProducts(products) {
    let listDiv = document.getElementById('products-list');
    if (!listDiv) return;
    listDiv.innerHTML = '';
    if (!products || products.length === 0) {
        listDiv.innerHTML = '<p style="text-align: center; color: #94a3b8;">لا توجد منتجات مسجلة حالياً (قاعدة البيانات فارغة).</p>';
        return;
    }
    let html = '';
    products.forEach(p => {
        html += `
            <div style="background-color: #334155; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong style="color: #38bdf8; font-size: 16px;">${p.name || 'بدون اسم'}</strong><br>
                    <small style="color: #94a3b8;">البائع: ${p.vendor || 'غير محدد'}</small>
                </div>
                <div>
                    <span>الكمية: ${p.quantity || 0}</span> | 
                    <span style="color: #38bdf8; font-weight: bold;">${p.price || 0} ر.س</span>
                </div>
            </div>
        `;
    });
    listDiv.innerHTML = html;
}

function filterProducts() {
    let searchInput = document.getElementById('search-input');
    if (!searchInput) return;
    let query = searchInput.value.toLowerCase();
    let filtered = allProductsCache.filter(p => p.name && p.name.toLowerCase().includes(query));
    displayProducts(filtered);
}

function addProduct() {
    const name = document.getElementById('product-name').value;
    const quantity = document.getElementById('product-quantity').value;
    const price = document.getElementById('product-price').value;

    fetch('/add-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, quantity, price })
    })
    .then(res => res.json())
    .then(data => {
        const msg = document.getElementById('login-msg');
        if(msg) {
            msg.innerText = data.message;
            msg.className = 'success';
        }
        loadProducts();
    })
    .catch(err => {
        const msg = document.getElementById('login-msg');
        if(msg) {
            msg.innerText = 'حدث خطأ أثناء الإضافة';
            msg.className = 'error';
        }
    });
}

loadProducts();
</script>
</body>
</html>
